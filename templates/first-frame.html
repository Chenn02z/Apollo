<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apollo first-frame template</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    :root {
      --paper: #faf8f5;
      --rule: rgba(0,0,0,0.08);
      --rail-color: #A85F47;
      --font-body: Georgia, "Times New Roman", "Noto Serif", serif;
      --font-heading: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
      --palette-1: #1C1C1C;
      --palette-2: #506B62;
      --palette-3: #A85F47;
      --palette-4: #5D7094;
      --palette-5: #A9824F;
      --palette-6: #806277;
      --palette-7: #8E6A58;
    }

    body {
      margin: 0;
      background: #e8e4dd;
      color: #1C1C1C;
      font-family: var(--font-body);
    }

    .slide {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      padding: 72px 80px 64px;
    }

    /* paper grain -- SVG noise at ~3.5% opacity */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
    }

    /* ---- chrome: rail ---- */
    .rail {
      position: absolute;
      left: 28px;
      top: 10%;
      bottom: 10%;
      width: 8px;
      background: var(--rail-color);
    }

    .rail-label {
      position: absolute;
      left: 8px;
      top: 50%;
      transform: rotate(-90deg);
      font: 600 12px/1 var(--font-mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rail-color);
      white-space: nowrap;
    }

    /* ---- chrome: masthead ---- */
    .masthead {
      position: relative;
      padding-bottom: 10px;
      border-bottom: 0.5px solid var(--rule);
      margin-bottom: 14px;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5D7094;
    }

    /* ---- first-frame content ---- */
    .first-frame-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding-left: 52px;
      position: relative;
    }

    .category {
      font: 600 14px/1.3 var(--font-heading);
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #A85F47;
      margin-bottom: 28px;
    }

    .topic {
      font: 700 72px/0.98 var(--font-body);
      letter-spacing: -0.055em;
      color: #1C1C1C;
      margin: 0;
      margin-bottom: 28px;
      max-width: 770px;
    }

    .commentary {
      font: 400 30px/1.28 var(--font-body);
      color: #5D7094;
    }

    /* ---- chrome: folio ---- */
    .folio {
      position: relative;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 0.5px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #5D7094;
    }

    .folio-page {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <section class="slide">
    <div class="rail"></div>
    <span class="rail-label">get cracked</span>
    <div class="masthead">Editorial Study Notes</div>
    <div class="first-frame-body">
      <p class="category">[CATEGORY]</p>
      <h1 class="topic">[TOPIC]</h1>
      <p class="commentary">[COMMENTARY]</p>
    </div>
    <div class="folio">
      <span>Apollo</span>
      <span class="folio-page">01 / 10</span>
    </div>
  </section>
</body>
</html>
