<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apollo slide template</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; }

    :root {
      --paper: #faf8f5;
      --ink: #1c1c1c;
      --accent: #2c3e6b;
      --accent-muted: #7a89a3;
      --warm-accent: #b85c3a;
      --rule: rgba(0,0,0,0.08);
      --font-body: Georgia, "Times New Roman", "Noto Serif", serif;
      --font-heading: system-ui, -apple-system, "Helvetica Neue", sans-serif;
      --font-mono: "SF Mono", "Menlo", "Consolas", "Liberation Mono", monospace;
      --body-size: 20px;
      --body-leading: 1.6;
    }

    body {
      margin: 0;
      background: #e8e4dd;
      color: var(--ink);
      font-family: var(--font-body);
    }

    .slide {
      width: 1080px;
      height: 1350px;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      padding: 72px 80px 64px;
    }

    /* paper grain -- SVG noise at ~3.5% opacity */
    .slide::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      pointer-events: none;
    }

    /* ---- chrome: masthead ---- */
    .masthead {
      position: relative;
      padding-bottom: 10px;
      border-bottom: 0.5px solid var(--rule);
      margin-bottom: 14px;
      font-family: var(--font-heading);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-muted);
    }

    /* ---- chrome: section label ---- */
    .section-label {
      position: relative;
      font-family: var(--font-heading);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 28px;
    }

    /* ---- body-safe-area ---- */
    #body-safe-area {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      font-size: var(--body-size);
      line-height: var(--body-leading);
    }

    #body-safe-area.archetype-hero     { justify-content: center; align-items: center; text-align: center; }
    #body-safe-area.archetype-fact     { justify-content: center; align-items: center; text-align: center; }
    #body-safe-area.archetype-quote    { justify-content: center; align-items: center; text-align: center; }
    #body-safe-area.archetype-split    { flex-direction: row; gap: 48px; align-items: center; }
    #body-safe-area.archetype-flow     { justify-content: flex-start; gap: 28px; }
    #body-safe-area.archetype-grid     { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; align-content: center; }
    #body-safe-area.archetype-takeaway { justify-content: flex-end; align-items: center; text-align: center; }

    /* ---- chrome: folio ---- */
    .folio {
      position: relative;
      margin-top: 14px;
      padding-top: 10px;
      border-top: 0.5px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: var(--font-heading);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--accent-muted);
    }

    .folio-page {
      font-feature-settings: "tnum";
      font-variant-numeric: tabular-nums;
    }

    .accent { color: var(--accent); }
    .coral { color: var(--warm-accent); }
  </style>
</head>
<body>
  <section class="slide">
    <div class="masthead">Editorial Study Notes</div>
    <div class="section-label">Topic · 01</div>
    <div id="body-safe-area">
      <p>Placeholder body content. Replace with authored slide content.</p>
    </div>
    <div class="folio">
      <span>Apollo</span>
      <span class="folio-page">01 / 10</span>
    </div>
  </section>
</body>
</html>
